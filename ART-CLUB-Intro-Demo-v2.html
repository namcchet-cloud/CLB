<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ART CLUB — Intro Demo v2</title>
<style>
:root{--paper:#f2eadb;--ink:#252923;--sage:#b9cba3;--rust:#a44331;--mustard:#e0bb58;--blue:#355972;--pink:#d990a4;--ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.2,1.35,.35,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#dfe7d2}
body{min-height:100vh;overflow:hidden}
.demo-page{position:fixed;inset:0;background:linear-gradient(180deg,#dce7d0,#f4edde 72%);overflow:hidden}
.demo-header{position:absolute;z-index:2;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);width:min(94vw,1120px);height:84px;border:1px solid rgba(37,41,35,.18);border-radius:999px;background:rgba(246,240,226,.92);box-shadow:0 10px 35px rgba(37,41,35,.08);display:flex;align-items:center;padding:12px 20px;gap:12px}
.header-logo{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:0 0 auto}.header-logo img{width:100%;height:100%;display:block;object-fit:cover}.header-copy{display:grid;line-height:1}.header-copy b{font-size:22px}.header-copy small{font-size:9px;letter-spacing:.18em;margin-top:7px}.header-pill{margin-left:auto;border:1px solid rgba(37,41,35,.2);border-radius:999px;padding:10px 16px;font-weight:700;font-size:13px}
.demo-hero{position:absolute;inset:0;display:grid;place-items:center;text-align:center;opacity:.35}.demo-hero h1{font-size:clamp(42px,8vw,98px);line-height:.9;margin:0;max-width:900px}.demo-hero p{font-size:18px;max-width:620px;margin:24px auto 0}
.replay{position:fixed;z-index:20001;right:18px;bottom:max(18px,env(safe-area-inset-bottom));border:1px solid rgba(37,41,35,.22);background:#f7f1e4;color:var(--ink);font:inherit;font-weight:800;border-radius:999px;padding:12px 18px;box-shadow:0 8px 30px rgba(37,41,35,.14);cursor:pointer}
.intro{position:fixed;inset:0;z-index:20000;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 46%,rgba(255,255,255,.985) 0 14%,rgba(244,237,223,.99) 50%,rgba(229,219,199,.995) 100%);isolation:isolate;opacity:1}
.intro::before{content:"";position:absolute;inset:-8%;opacity:.17;background-image:radial-gradient(circle at 15% 20%,rgba(37,41,35,.16) 0 1px,transparent 1.5px),radial-gradient(circle at 72% 64%,rgba(164,67,49,.1) 0 1px,transparent 1.5px);background-size:19px 21px,27px 29px;transform:rotate(-2deg)}
.stage{position:relative;width:min(88vw,720px);height:min(72vh,520px);min-height:390px;display:grid;place-items:center;transform:translateZ(0)}
.wordmark{position:absolute;z-index:5;left:50%;top:34%;transform:translate(-50%,-50%);width:min(92%,650px);height:auto;overflow:visible;filter:drop-shadow(0 2px 0 rgba(255,255,255,.8))}
.wordmark path{fill:none;stroke:var(--ink);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pathLength:1;stroke-dasharray:1;stroke-dashoffset:1}
.wordmark path:nth-child(1){animation:draw .50s .18s var(--ease) forwards}.wordmark path:nth-child(2){animation:draw .50s .32s var(--ease) forwards}.wordmark path:nth-child(3){animation:draw .50s .46s var(--ease) forwards}.wordmark path:nth-child(4){animation:draw .50s .60s var(--ease) forwards}.wordmark path:nth-child(5){animation:draw .50s .74s var(--ease) forwards}.wordmark path:nth-child(6){animation:draw .50s .88s var(--ease) forwards}.wordmark path:nth-child(7){animation:draw .50s 1.02s var(--ease) forwards}
.pencil{position:absolute;z-index:3;left:50%;top:34%;width:min(93%,660px);height:155px;transform:translate(-50%,-50%) rotate(-1deg) scale(.96);border:2px solid rgba(37,41,35,.09);border-radius:46% 54% 48% 52%;opacity:0;animation:pencil .8s .38s ease-out forwards}
.wash{position:absolute;z-index:2;left:50%;top:36%;width:min(94%,680px);height:250px;transform:translate(-50%,-50%) scale(.76) rotate(-2deg);opacity:0;filter:blur(10px) saturate(.88);background:radial-gradient(ellipse at 30% 45%,rgba(185,203,163,.78) 0 20%,transparent 50%),radial-gradient(ellipse at 65% 40%,rgba(217,144,164,.5) 0 19%,transparent 47%),radial-gradient(ellipse at 55% 69%,rgba(224,187,88,.42) 0 17%,transparent 45%),radial-gradient(ellipse at 42% 40%,rgba(93,125,145,.34) 0 17%,transparent 43%);mix-blend-mode:multiply;animation:wash 1.05s .72s var(--ease) forwards}
.emblem{position:absolute;z-index:6;left:50%;top:67%;width:clamp(112px,20vw,160px);aspect-ratio:1;border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.78) rotate(-4deg);box-shadow:0 12px 32px rgba(37,41,35,.11);animation:emblemIn .58s 1.30s var(--spring) forwards;will-change:transform,opacity}
.emblem img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
.sticker{position:absolute;z-index:7;display:grid;place-items:center;opacity:0;transform:scale(.15) rotate(var(--r));font-weight:900;filter:drop-shadow(2px 3px 0 rgba(37,41,35,.12));will-change:transform,opacity}
.s1{left:7%;top:18%;font-size:50px;color:var(--mustard);--r:-13deg;animation:pop .46s 1.22s var(--spring) forwards,floatA 1.8s 1.75s ease-in-out infinite alternate}.s2{right:5%;top:21%;font-size:46px;color:var(--rust);--r:11deg;animation:pop .46s 1.38s var(--spring) forwards,floatB 1.9s 1.85s ease-in-out infinite alternate}.s3{left:14%;bottom:11%;font-size:42px;color:var(--blue);--r:7deg;animation:pop .46s 1.52s var(--spring) forwards,floatA 1.7s 1.95s ease-in-out infinite alternate}.s4{right:13%;bottom:12%;width:92px;height:42px;--r:-9deg;animation:pop .46s 1.66s var(--spring) forwards,floatB 2s 2.05s ease-in-out infinite alternate}.s4::before,.s4::after{content:"";position:absolute;height:5px;border-radius:999px;background:var(--pink);left:0;right:0;transform:rotate(5deg)}.s4::after{top:23px;left:17%;right:9%;transform:rotate(-8deg)}
.caption{position:absolute;left:50%;bottom:1%;transform:translateX(-50%);font-size:12px;letter-spacing:.17em;font-weight:800;text-transform:uppercase;color:rgba(37,41,35,.48);opacity:0;animation:caption .5s 1.55s ease forwards;white-space:nowrap}
.intro.handoff .wordmark,.intro.handoff .wash,.intro.handoff .pencil,.intro.handoff .caption{opacity:0!important;transition:opacity .42s ease}.intro.handoff .sticker{animation:stickerOut .52s var(--ease) forwards}.intro.leaving{pointer-events:none}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pencil{from{opacity:0;transform:translate(-50%,-50%) rotate(-3deg) scale(.86)}to{opacity:.5;transform:translate(-50%,-50%) rotate(-1deg) scale(1)}}
@keyframes wash{0%{opacity:0;transform:translate(-50%,-50%) scale(.76) rotate(-2deg)}55%{opacity:.82}100%{opacity:.66;transform:translate(-50%,-50%) scale(1) rotate(0)}}
@keyframes emblemIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.72) rotate(-6deg)}72%{opacity:1;transform:translate(-50%,-50%) scale(1.07) rotate(1deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.15) rotate(calc(var(--r) - 18deg))}72%{opacity:1;transform:scale(1.13) rotate(calc(var(--r) + 3deg))}100%{opacity:.95;transform:scale(1) rotate(var(--r))}}@keyframes floatA{to{translate:0 -7px;rotate:2deg}}@keyframes floatB{to{translate:4px -5px;rotate:-2deg}}@keyframes caption{to{opacity:1}}@keyframes stickerOut{to{opacity:0;translate:var(--x,0) var(--y,-30px);scale:.72;rotate:10deg}}
@media(max-width:620px){.demo-header{height:72px;padding:10px 14px}.header-logo{width:46px;height:46px}.header-copy b{font-size:17px}.header-pill{display:none}.stage{width:94vw;height:64vh;min-height:370px}.wordmark{width:94%;top:36%}.wordmark path{stroke-width:7}.wash{top:38%;height:210px}.pencil{top:36%;height:130px}.emblem{top:68%;width:clamp(105px,31vw,138px)}.s1{left:3%;top:18%;font-size:38px}.s2{right:3%;top:20%;font-size:36px}.s3{left:8%;bottom:12%;font-size:34px}.s4{right:7%;bottom:12%;width:70px}.caption{font-size:9px;bottom:0}}
@media(prefers-reduced-motion:reduce){.intro{display:none}}
</style>
</head>

<script>
const tpl=document.getElementById('introTpl'), target=document.getElementById('targetLogo');
let timers=[];
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function play(){
  clearTimers();document.getElementById('intro')?.remove();
  document.body.append(tpl.content.cloneNode(true));
  const overlay=document.getElementById('intro'), emblem=overlay.querySelector('.emblem');
  const stickers=[...overlay.querySelectorAll('.sticker')];
  [['-42px','-34px'],['42px','-30px'],['-36px','38px'],['38px','34px']].forEach((v,i)=>{stickers[i].style.setProperty('--x',v[0]);stickers[i].style.setProperty('--y',v[1])});
  // 0–1.55s: drawing. 1.3–1.9s: emblem/stickers. 1.9–2.55s: deliberate hold.
  timers.push(setTimeout(()=>{
    overlay.classList.add('handoff','leaving');
    const a=emblem.getBoundingClientRect(), b=target.getBoundingClientRect();
    const dx=(b.left+b.width/2)-(a.left+a.width/2), dy=(b.top+b.height/2)-(a.top+a.height/2), s=b.width/a.width;
    emblem.animate([
      {transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:0},
      {transform:'translate(-50%,-52%) scale(1.025)',opacity:1,offset:.12},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${s})`,opacity:1,offset:.9},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${s})`,opacity:0,offset:1}
    ],{duration:780,easing:'cubic-bezier(.2,.78,.2,1)',fill:'forwards'});
    overlay.animate([{opacity:1},{opacity:1,offset:.62},{opacity:0}],{duration:820,easing:'ease',fill:'forwards'});
  },2550));
  timers.push(setTimeout(()=>overlay.remove(),3400));
}
document.getElementById('replay').addEventListener('click',play);play();
</script>
