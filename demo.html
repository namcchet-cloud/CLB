<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Raven Lin — Geats Driver Henshin Demo</title>
<style>
:root{--red:#ff1834;--white:#f7f7f7;--ink:#07090e;--muted:#8991a0;--cyan:#6ee7ff}
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#020306;color:white;overflow:hidden}
button{font:inherit}
.stage{position:relative;width:100vw;height:100dvh;min-height:560px;display:grid;place-items:center;isolation:isolate;background:radial-gradient(circle at 50% 48%,#151824 0 18%,#080a0f 38%,#020306 72%)}
.grid{position:absolute;inset:-20%;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;transform:perspective(700px) rotateX(62deg) translateY(38%);mask-image:linear-gradient(to bottom,transparent 0,#000 35%,#000 72%,transparent 100%)}
.vignette{position:absolute;inset:0;box-shadow:inset 0 0 160px 48px #000;pointer-events:none;z-index:30}
.flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;z-index:25;mix-blend-mode:screen}
.scan{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--red),white,var(--red),transparent);filter:drop-shadow(0 0 10px var(--red));top:0;opacity:0;z-index:22}
.hud{position:absolute;width:min(78vw,780px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.08);opacity:.5;z-index:0}
.hud:before,.hud:after{content:"";position:absolute;inset:9%;border-radius:50%;border:1px dashed rgba(255,24,52,.18)}
.hud:after{inset:22%;border-style:solid;border-color:rgba(255,255,255,.07)}
.ring{position:absolute;width:min(64vw,640px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,24,52,.0);z-index:1;transform:scale(.7);opacity:0}
.driver-wrap{position:relative;width:min(86vw,920px);aspect-ratio:2.35;z-index:5;transform-style:preserve-3d;filter:drop-shadow(0 28px 28px rgba(0,0,0,.55))}
.asset{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);user-select:none;-webkit-user-drag:none;pointer-events:none;will-change:transform,opacity,filter}
.base{width:72%;opacity:0;z-index:1}
.buckle.white{width:47%;left:29%;opacity:0;z-index:5;transform-origin:84% 52%}
.buckle.red{width:39%;left:74%;opacity:0;z-index:6;transform-origin:14% 48%}
.angled{width:47%;opacity:0;z-index:7}
.final-full{width:100%;opacity:0;z-index:10}
.panel{width:100%;opacity:0;z-index:11;transform-origin:50% 50%}
.p1{clip-path:polygon(0 0,50% 0,50% 48%,0 58%);transform-origin:48% 49%}
.p2{clip-path:polygon(0 55%,50% 48%,50% 100%,0 100%);transform-origin:48% 51%}
.p3{clip-path:polygon(50% 0,100% 0,100% 58%,50% 48%);transform-origin:52% 49%}
.p4{clip-path:polygon(50% 48%,100% 55%,100% 100%,50% 100%);transform-origin:52% 51%}
.p5{clip-path:polygon(34% 0,66% 0,63% 48%,37% 48%);transform-origin:50% 46%}
.p6{clip-path:polygon(37% 48%,63% 48%,65% 100%,35% 100%);transform-origin:50% 54%}
.p7{clip-path:circle(14% at 50% 55%);transform-origin:50% 55%;z-index:12}
.p8{clip-path:polygon(0 35%,22% 35%,22% 68%,0 68%,78% 35%,100% 35%,100% 68%,78% 68%);z-index:9}
.energy{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.3);opacity:0;z-index:20;background:radial-gradient(circle,rgba(255,255,255,.95) 0 6%,rgba(255,24,52,.9) 8% 12%,rgba(255,24,52,.14) 28%,transparent 64%);box-shadow:0 0 40px 14px rgba(255,24,52,.35)}
.spark{position:absolute;left:50%;top:50%;width:4px;height:120px;background:linear-gradient(transparent,white,var(--red),transparent);transform-origin:50% 100%;opacity:0;z-index:19}
.label{position:absolute;left:50%;bottom:max(9vh,62px);transform:translateX(-50%);text-align:center;z-index:40;opacity:0;min-width:min(86vw,680px)}
.label .kicker{font-size:11px;letter-spacing:.36em;color:#b5bdca;margin-bottom:8px}
.label h1{margin:0;font-size:clamp(34px,6vw,76px);line-height:.92;letter-spacing:.08em;font-weight:900;text-transform:uppercase;text-shadow:0 0 18px rgba(255,24,52,.35)}
.label .sub{font-size:12px;letter-spacing:.18em;color:#ff7a8c;margin-top:11px}
.status{position:absolute;top:max(20px,env(safe-area-inset-top));left:22px;z-index:50;font:600 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:#a7afbd;text-transform:uppercase}
.status b{color:white;font-weight:700}.controls{position:absolute;right:20px;bottom:max(20px,env(safe-area-inset-bottom));z-index:60;display:flex;gap:10px}
.btn{border:1px solid rgba(255,255,255,.18);background:rgba(10,12,18,.7);backdrop-filter:blur(14px);color:white;border-radius:999px;padding:11px 16px;cursor:pointer;transition:.2s transform,.2s background,.2s border-color;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.38)}.btn.primary{background:linear-gradient(135deg,#d80f2a,#ff2441);border-color:#ff4960;box-shadow:0 8px 30px rgba(255,24,52,.22)}
.stage.shake{animation:shake .23s linear 1}@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,1px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-2px,2px)}80%{transform:translate(2px,-1px)}}
@media (max-width:600px){.driver-wrap{width:96vw}.label{bottom:15vh}.controls{right:50%;transform:translateX(50%);bottom:22px}.status{left:14px;top:14px}.hud{width:100vw}.ring{width:90vw}.btn{padding:10px 13px}}
@media (prefers-reduced-motion:reduce){.hud,.ring,.grid{display:none}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="grid"></div><div class="hud"></div><div class="ring" id="ring"></div><div class="scan" id="scan"></div><div class="flash" id="flash"></div>
  <div class="status">RAVEN / DRIVER DEMO<br><b id="state">READY</b></div>
  <div class="driver-wrap" id="driver">
    <img class="asset base" id="base" src="assets/base.png" alt="" />
    <img class="asset buckle white" id="white" src="assets/white_buckle.png" alt="" />
    <img class="asset buckle red" id="red" src="assets/red_buckle.png" alt="" />
    <img class="asset angled" id="angled" src="assets/angled.png" alt="" />
    <img class="asset final-full" id="final" src="assets/final.png" alt="" />
    <img class="asset panel p1" src="assets/final.png" alt="" /><img class="asset panel p2" src="assets/final.png" alt="" />
    <img class="asset panel p3" src="assets/final.png" alt="" /><img class="asset panel p4" src="assets/final.png" alt="" />
    <img class="asset panel p5" src="assets/final.png" alt="" /><img class="asset panel p6" src="assets/final.png" alt="" />
    <img class="asset panel p7" src="assets/final.png" alt="" /><img class="asset panel p8" src="assets/final.png" alt="" />
    <div class="energy" id="energy"></div>
    <i class="spark" style="transform:translate(-50%,-100%) rotate(15deg)"></i><i class="spark" style="transform:translate(-50%,-100%) rotate(62deg)"></i><i class="spark" style="transform:translate(-50%,-100%) rotate(112deg)"></i><i class="spark" style="transform:translate(-50%,-100%) rotate(168deg)"></i><i class="spark" style="transform:translate(-50%,-100%) rotate(225deg)"></i><i class="spark" style="transform:translate(-50%,-100%) rotate(292deg)"></i>
  </div>
  <section class="label" id="label"><div class="kicker">ARTIST PROFILE // ENTRY</div><h1>RAVEN LIN</h1><div class="sub">GEATS DRIVER // HENSHIN COMPLETE</div></section>
  <div class="controls"><button class="btn" id="skip">Skip</button><button class="btn primary" id="play">Henshin</button></div>
  <div class="vignette"></div>
</main>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const stage=$('#stage'),state=$('#state'),play=$('#play'),skip=$('#skip');
const base=$('#base'),white=$('#white'),red=$('#red'),angled=$('#angled'),final=$('#final'),ring=$('#ring'),flash=$('#flash'),scan=$('#scan'),energy=$('#energy'),label=$('#label');
let running=false, animations=[], timers=[];
function anim(el,keyframes,opts){const a=el.animate(keyframes,{fill:'forwards',easing:'cubic-bezier(.2,.8,.2,1)',...opts});animations.push(a);return a}
function later(ms,fn){const id=setTimeout(fn,ms);timers.push(id);return id}
function tone(freq=140,dur=.08,type='square',gain=.05,delay=0){try{const ac=tone.ac||(tone.ac=new (window.AudioContext||window.webkitAudioContext)());const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime+delay);g.gain.setValueAtTime(0.0001,ac.currentTime+delay);g.gain.exponentialRampToValueAtTime(gain,ac.currentTime+delay+.008);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+delay+dur);o.connect(g).connect(ac.destination);o.start(ac.currentTime+delay);o.stop(ac.currentTime+delay+dur+.02)}catch(e){}}
function clickSfx(){tone(90,.07,'square',.04);tone(220,.05,'triangle',.03,.02)}
function lockSfx(){tone(75,.12,'square',.06);tone(410,.08,'sawtooth',.025,.04);tone(820,.05,'triangle',.02,.09)}
function henshinSfx(){tone(140,.18,'sawtooth',.04);tone(280,.22,'sawtooth',.028,.05);tone(560,.26,'triangle',.03,.11);tone(1120,.18,'sine',.028,.2)}
function cancel(){animations.forEach(a=>a.cancel());animations=[];timers.forEach(clearTimeout);timers=[];running=false;stage.classList.remove('shake')}
function reset(){cancel();state.textContent='READY';[base,white,red,angled,final,ring,flash,scan,energy,label,...$$('.panel'),...$$('.spark')].forEach(el=>{el.getAnimations().forEach(a=>a.cancel());el.removeAttribute('style')}); play.textContent='Henshin'}
function finishNow(){cancel();base.style.opacity=0;white.style.opacity=0;red.style.opacity=0;angled.style.opacity=0;$$('.panel').forEach(x=>x.style.opacity=0);final.style.opacity=1;final.style.transform='translate(-50%,-50%) scale(1)';label.style.opacity=1;state.textContent='COMPLETE';play.textContent='Replay'}
function playSequence(){reset();running=true;play.textContent='Running';state.textContent='BOOT';clickSfx();
  anim(base,[{opacity:0,transform:'translate(-50%,-50%) scale(.72) rotateX(18deg)',filter:'blur(9px)'},{opacity:1,transform:'translate(-50%,-50%) scale(1) rotateX(0)',filter:'blur(0)'}],{duration:520});
  anim(ring,[{opacity:0,transform:'scale(.62)',borderColor:'rgba(255,24,52,0)'},{opacity:.7,transform:'scale(1)',borderColor:'rgba(255,24,52,.55)'},{opacity:.15,transform:'scale(1.28)',borderColor:'rgba(255,255,255,.08)'}],{duration:900});
  anim(scan,[{opacity:0,top:'8%'},{opacity:.85,offset:.12},{opacity:.35,top:'92%',offset:.82},{opacity:0,top:'100%'}],{duration:820});
  later(560,()=>{state.textContent='SET';clickSfx();
    anim(white,[{opacity:0,transform:'translate(-50%,-50%) translateX(-72vw) rotate(-22deg) scale(.78)',filter:'blur(10px)'},{opacity:1,offset:.72,transform:'translate(-50%,-50%) translateX(-6%) rotate(-3deg) scale(1.03)',filter:'blur(0)'},{opacity:1,transform:'translate(-50%,-50%) translateX(0) rotate(0) scale(1)'}],{duration:650,easing:'cubic-bezier(.1,.75,.12,1)'});
    anim(red,[{opacity:0,transform:'translate(-50%,-50%) translateX(72vw) rotate(24deg) scale(.72)',filter:'blur(10px)'},{opacity:1,offset:.72,transform:'translate(-50%,-50%) translateX(7%) rotate(4deg) scale(1.04)',filter:'blur(0)'},{opacity:1,transform:'translate(-50%,-50%) translateX(0) rotate(0) scale(1)'}],{duration:700,easing:'cubic-bezier(.1,.75,.12,1)'});
  });
  later(1260,()=>{state.textContent='LOCK';lockSfx();stage.classList.add('shake');later(230,()=>stage.classList.remove('shake'));anim(energy,[{opacity:0,transform:'translate(-50%,-50%) scale(.2)'},{opacity:.95,transform:'translate(-50%,-50%) scale(.85)',offset:.35},{opacity:0,transform:'translate(-50%,-50%) scale(1.55)'}],{duration:480});});
  later(1710,()=>{state.textContent='REVOLVE';henshinSfx();
    anim(white,[{opacity:1,transform:'translate(-50%,-50%) rotateY(0) rotateZ(0)'},{opacity:.15,transform:'translate(-50%,-50%) rotateY(78deg) rotateZ(14deg)',offset:.5},{opacity:0,transform:'translate(-50%,-50%) rotateY(150deg) rotateZ(28deg)'}],{duration:520,easing:'cubic-bezier(.55,.05,.4,.95)'});
    anim(red,[{opacity:1,transform:'translate(-50%,-50%) rotateY(0) rotateZ(0)'},{opacity:.15,transform:'translate(-50%,-50%) rotateY(-78deg) rotateZ(-14deg)',offset:.5},{opacity:0,transform:'translate(-50%,-50%) rotateY(-150deg) rotateZ(-28deg)'}],{duration:520,easing:'cubic-bezier(.55,.05,.4,.95)'});
    anim(angled,[{opacity:0,transform:'translate(-50%,-50%) scale(.74) rotateZ(-24deg) rotateY(-70deg)'},{opacity:1,offset:.46,transform:'translate(-50%,-50%) scale(1.03) rotateZ(4deg) rotateY(0)'},{opacity:0,transform:'translate(-50%,-50%) scale(.9) rotateZ(26deg) rotateY(74deg)'}],{duration:620,easing:'cubic-bezier(.45,0,.3,1)'});
  });
  later(2250,()=>{state.textContent='DEPLOY';
    base.animate([{opacity:1},{opacity:.2}],{duration:420,fill:'forwards'});
    const panels=$$('.panel'); const starts=[[-18,-16,-28],[15,20,24],[18,-16,28],[-15,20,-24],[0,-26,0],[0,24,0],[0,0,0],[0,0,0]];
    panels.forEach((p,i)=>{const [x,y,r]=starts[i];anim(p,[{opacity:0,transform:`translate(-50%,-50%) translate(${x}%,${y}%) rotate(${r}deg) scale(${i===6?.38:.72})`,filter:'brightness(1.4) blur(3px)'},{opacity:1,offset:.72,transform:'translate(-50%,-50%) translate(0,0) rotate(0) scale(1.04)',filter:'brightness(1.15) blur(0)'},{opacity:1,transform:'translate(-50%,-50%) translate(0,0) rotate(0) scale(1)',filter:'brightness(1) blur(0)'}],{duration:540,delay:i*48,easing:'cubic-bezier(.16,.84,.24,1)'});});
    $$('.spark').forEach((s,i)=>anim(s,[{opacity:0,scaleY:.2},{opacity:.9,offset:.22,scaleY:1},{opacity:0,scaleY:1.5}],{duration:520,delay:i*25}));
  });
  later(2830,()=>{state.textContent='HENSHIN';stage.classList.add('shake');later(240,()=>stage.classList.remove('shake'));anim(flash,[{opacity:0},{opacity:.96,offset:.18},{opacity:.18,offset:.36},{opacity:0}],{duration:430,easing:'linear'});anim(energy,[{opacity:0,transform:'translate(-50%,-50%) scale(.35)'},{opacity:1,transform:'translate(-50%,-50%) scale(1.2)',offset:.35},{opacity:0,transform:'translate(-50%,-50%) scale(2.6)'}],{duration:650});});
  later(3140,()=>{ $$('.panel').forEach(x=>x.style.opacity=0);anim(final,[{opacity:0,transform:'translate(-50%,-50%) scale(.94)',filter:'brightness(2)'},{opacity:1,offset:.25,transform:'translate(-50%,-50%) scale(1.045)',filter:'brightness(1.3)'},{opacity:1,transform:'translate(-50%,-50%) scale(1)',filter:'brightness(1)'}],{duration:520});});
  later(3500,()=>{state.textContent='COMPLETE';anim(label,[{opacity:0,transform:'translateX(-50%) translateY(24px)',filter:'blur(8px)'},{opacity:1,transform:'translateX(-50%) translateY(0)',filter:'blur(0)'}],{duration:560});});
  later(4200,()=>{running=false;play.textContent='Replay'});
}
play.addEventListener('click',playSequence); skip.addEventListener('click',finishNow);document.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();playSequence()}if(e.key==='Escape')finishNow()});
setTimeout(playSequence,350);
</script>
</body></html>
